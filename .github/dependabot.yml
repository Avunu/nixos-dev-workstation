version: 2

updates:
  # Nix flake inputs
  - package-ecosystem: nix
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: chore
    groups:
      nix:
        patterns: ["*"]

  # Nix flake inputs of the local host configuration
  - package-ecosystem: nix
    directory: /local
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    labels: ["dependencies"]
    commit-message:
      prefix: chore
    groups:
      nix-local:
        patterns: ["*"]

  # Global npm tools (bun and friends)
  - package-ecosystem: npm
    directory: /global-npm-tools
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    labels: ["dependencies"]
    commit-message:
      prefix: chore
    groups:
      npm-global-tools:
        patterns: ["*"]
